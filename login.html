<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Plataforma ExpeRT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="lindo.css">
</head>
<body class="login-page">

  <header class="site-header">
    <div id="logo-container">
      <a href="index.html" class="logo-link">
        <div class="logo-text">ExpeRT <span>Platform</span></div>
      </a>
    </div>

    <nav id="header-buttons">
      <a href="index.html" class="btn-header">
        <i class="bi bi-arrow-left"></i> Voltar
      </a>
      <button class="btn-header theme-toggle" id="themeToggle" aria-label="Alternar tema">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
      </button>
    </nav>
  </header>

  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <i class="bi bi-shield-lock-fill login-icon"></i>
        <h2>Acesso à Plataforma</h2>
        <p>Digite as suas credenciais para continuar</p>
      </div>

      <!-- Div para exibir mensagens de erro do Banco de Dados -->
      <div id="mensagemErro" style="display:none; color: #ff4757; text-align: center; margin-bottom: 1rem; font-weight: 600;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" name="email" autocomplete="username" placeholder="seu.email@ifc.edu.br" required>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <i class="bi bi-lock"></i>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember"> Lembrar-me
          </label>
          <a href="#" class="forgot-password">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-animado btn-login-submit" id="btnSubmit">Entrar</button>
      </form>

      <div class="login-footer">
        <p>Não tem conta? <a href="#">Solicite o acesso</a> ao administrador do sistema.</p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Plataforma ExpeRT — Instituto Federal Catarinense (Campus Sombrio)</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- CONTROLE DE TEMA ---
      const themeToggleBtn = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const htmlElement = document.documentElement;

      function applyTheme(theme) {
        htmlElement.setAttribute('data-theme', theme);
        themeIcon.className = theme === 'dark' ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
      }

      const savedTheme = localStorage.getItem('expert_theme') || 'dark';
      applyTheme(savedTheme);

      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme);
        localStorage.setItem('expert_theme', newTheme);
      });

      // --- CONEXÃO DIRETA DO HTML / JS COM O BACKEND/MYSQL ---
      const loginForm = document.getElementById('loginForm');
      const mensagemErro = document.getElementById('mensagemErro');
      const botaoSubmit = document.getElementById('btnSubmit');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // Impede o recarregamento da página
        mensagemErro.style.display = 'none';
        botaoSubmit.disabled = true;

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
          // Envia os dados para o script que consulta o MySQL
          const response = await fetch('login.php', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.mensagem || 'Não foi possível entrar. Tente novamente.');
          }

          if (data.sucesso) {
            // Salva dados da sessão e redireciona para a página principal
            localStorage.setItem('usuario_logado', JSON.stringify(data.usuario));
            window.location.href = 'index.html';
          } else {
            // Exibe mensagem de erro retornada do MySQL
            mensagemErro.innerText = data.mensagem;
            mensagemErro.style.display = 'block';
          }
        } catch (error) {
          mensagemErro.innerText = error.message || 'Erro ao conectar ao servidor. Tente novamente.';
          mensagemErro.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
